# Values ship reads. Format and keys: anderix/ship, docs/DESIGN.md.
#
# Two targets, which is the whole release today. The Microsoft Store and the
# Mac App Store both hold a reserved name for this application and neither has
# ever received a build, and `ship` refuses a first submission on purpose: it
# is Partner Center's and App Store Connect's to make, age ratings and all.
# `msix` and `appstore` land here, with `store_locales`, once each store has
# published once — the same order odox is taking.
targets=apt crates
apt_package=filebase
commands=filebase
crates=filebase
display_name=Filebase
