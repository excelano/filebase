# Values ship reads. Format and keys: anderix/ship, docs/DESIGN.md.
#
# The Microsoft Store's first submission published (by hand, in Partner
# Center — ship refuses a first submission on purpose), so msix joins here
# with store_locales, which a store target requires present. The Mac App
# Store's first submission is still Waiting for Review as of 2026-09-22:
# ship's appstore step only takes over a version still PREPARE_FOR_SUBMISSION
# or rejected, not one under review, so appstore stays off the list until
# that first review actually publishes — adding it earlier just makes ship
# refuse the moment it reaches that step.
targets=apt crates msix
apt_package=filebase
commands=filebase
crates=filebase
store_locales=en-us de-de
display_name=Filebase
